<?xml version="1.0" encoding="UTF-8" ?>
<!--
  Cyclone DDS profile (localhost-only multicast).
  nodered-ros2-opera の launch_content/cyclone_profile.xml と同等の内容で、
  同 host 内に常駐する両 container 間で discovery が両方向に通るよう揃える。
  共有マシンで他人の ROS 2 multicast を拾わない / 仮想 NIC や VPN が複数ある
  環境で誤 interface に流れない、という安全側の設定。
-->
<CycloneDDS>
 <Domain>
     <General>
         <Interfaces>
            <NetworkInterface address="127.0.0.1" multicast="true"/>
         </Interfaces>
         <DontRoute>true</DontRoute>
     </General>
 </Domain>
</CycloneDDS>
