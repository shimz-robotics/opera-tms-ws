name: opera-tms-dev

services:
  mongodb:
    image: mongo:6.0
    container_name: opera_tms_mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  tms:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${UID:-1000}
        USER_GID: ${GID:-1000}
    image: opera-tms-dev:latest
    container_name: opera_tms_dev
    network_mode: host
    shm_size: 1g
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
      - MONGO_HOST=localhost
      - MONGO_PORT=27017
      - ROS_DOMAIN_ID=${ROS_DOMAIN_ID:-0}
      # デフォルトは Cyclone DDS。nodered-ros2-opera (Cyclone hardcoded) との同 host 並列 + host
      # zenoh-bridge-ros2dds 経由 WAN 接続の両シナリオに揃えるための選択。
      - RMW_IMPLEMENTATION=${RMW_IMPLEMENTATION:-rmw_cyclonedds_cpp}
      # 同 host で nodered と localhost multicast で peer-to-peer する想定のため、
      # repo 直下の cyclonedds.conf を bind mount で固定して指す (override 不要)。
      - CYCLONEDDS_URI=/opt/opera-tms/cyclonedds.conf
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-${HOME}/.Xauthority}:/home/ros/.Xauthority:ro
      - ./cyclonedds.conf:/opt/opera-tms/cyclonedds.conf:ro
      # Bind mount the entire workspace src/ — ros2_tms_for_construction and
      # all external deps (populated by `vcs import` on the host) live here.
      - ./src/:/workspace/src/
      - tms_build:/workspace/build
      - tms_install:/workspace/install
      - tms_log:/workspace/log
    depends_on:
      - mongodb
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
  tms_build:
  tms_install:
  tms_log:
